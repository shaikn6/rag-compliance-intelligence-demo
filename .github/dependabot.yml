version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # requirements.txt uses >= ranges; only bump when the range excludes the new version.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
    groups:
      pip:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github_actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
